# orchard-maintenance.yml — SUPERSEDED 2026-08-11
#
# This workflow has been replaced by the Azure Container Apps engine job
# caj-p42-engine-prod-eus-01, which handles source-change detection and
# staleness-driven maintenance as part of its 7-phase pipeline.
#
# This file is retained as a historical reference and emergency fallback.
# The schedule and workflow_dispatch triggers are disabled to prevent
# accidental dual-execution with the ACA job.
#
# See: project42dev-ops/pmo/plans/delivery-platform-hosting-comparison.md
# See: project42dev-ops/docs/adrs/0007-foundry-delivery-platform-boundary.md

name: Orchard Maintenance (SUPERSEDED — DO NOT USE)

on:
    # schedule: DISABLED — ACA engine job handles this
    #     - cron: "0 8 * * 0"
    # workflow_dispatch: DISABLED — use ACA harness job for manual runs
    # workflow_dispatch:
    #     inputs:
    #         forceSourceRefresh:
    #             description: "Check all sources regardless of fetch interval"
    #             default: false
    #             type: boolean

concurrency:
    group: orchard-maintenance
    cancel-in-progress: false

permissions:
    contents: read
    issues: write
    id-token: write

env:
    NODE_VERSION: "22"

jobs:
    maintenance:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        environment: production

        if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # ---- Phase 0: Checkout platform repo for corpus and source registry ----
            - name: Checkout project42-platform (corpus + registry)
              uses: actions/checkout@v4
              with:
                  repository: project42dev/project42-platform
                  path: project42-platform

            # ---- Phase 1: Source-change detection ----
            # Fetch every registered source URL, normalize, hash, and compare against
            # the stored checkpoint. Changed sources become needs-updating work items.
            - name: Detect source changes
              id: source-changes
              run: |
                  FORCE_FLAG=""
                  if [ "${{ github.event_name == 'workflow_dispatch' && inputs.forceSourceRefresh || false }}" = "true" ]; then
                    FORCE_FLAG="-ForceSourceRefresh"
                  fi

                  # Ensure checkpoint directory exists
                  mkdir -p delivery/private

                  pwsh -NoProfile -Command "
                    Import-Module '$(pwd)/delivery/Project42SourceChange.psm1' -Force
                    \$changes = @(Get-Project42SourceChangeSet \
                      -RegistryPath '$(pwd)/project42-platform/content/source-registry.json' \
                      -CheckpointPath '$(pwd)/delivery/private/source-detection.checkpoint.private.json' \
                      -DeferChangeCommit \
                      $FORCE_FLAG)
                    \$changed = (\$changes | Where-Object { \$_.state -eq 'changed' }).Count
                    \$unreachable = (\$changes | Where-Object { \$_.state -eq 'unreachable' }).Count
                    \$unchanged = (\$changes | Where-Object { \$_.state -eq 'unchanged' }).Count
                    Write-Host \"source-check: \$unchanged unchanged, \$changed changed, \$unreachable unreachable\"
                    # Write change manifest for the brief generator
                    \$manifest = \$changes | Where-Object { \$_.state -eq 'changed' } | ForEach-Object {
                      [pscustomobject]@{ sourceId = \$_.sourceId; url = \$_.url; previousDigest = \$_.previousDigest; currentDigest = \$_.currentDigest; checkedAt = \$_.checkedAt }
                    }
                    if (\$manifest) {
                      \$manifest | ConvertTo-Json -Compress | Out-File -FilePath '$(pwd)/delivery/private/source-changes.json' -Encoding utf8
                    }
                    Write-Host \"source-changes=\$changed\" >> \$env:GITHUB_OUTPUT
                  "
              continue-on-error: false

            # ---- Phase 2: Database rebuild ----
            # Rebuilds the content index and creates needs-updating work items from
            # v_stale and v_stale_citation views. Also picks up source-change items.
            - name: Build content database
              id: build-db
              run: |
                  node scripts/build-content-db.mjs \
                    --content project42-platform/content \
                    --db content.db \
                    --ado-sync
              continue-on-error: false

            # ---- Phase 3: Briefs ----
            # Generate briefs for ALL queued work items (both needs-creating and
            # needs-updating). The maintenance workflow primarily produces updates.
            - name: Generate maintenance briefs
              id: briefs
              run: |
                  node scripts/generate-briefs.mjs \
                    --db content.db \
                    --out briefs/maintenance-queue.json \
                    --inventory config/deployed-models.json \
                    --apply
              continue-on-error: false

            # ---- Phase 4: Check for briefs ----
            - name: Check for briefs to deliver
              id: check-briefs
              run: |
                  COUNT=$(node -e "const q=require('./briefs/maintenance-queue.json'); console.log(Array.isArray(q) ? q.length : (q.items||[]).length)")
                  echo "count=$COUNT" >> $GITHUB_OUTPUT
                  if [ "$COUNT" -eq 0 ]; then
                    echo "No maintenance briefs to deliver; skipping delivery, ingest, and notify."
                  fi

            # ---- Phase 5: Delivery ----
            - name: Azure login
              if: steps.check-briefs.outputs.count != '0'
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Get Foundry access token
              id: token
              if: steps.check-briefs.outputs.count != '0'
              run: |
                  TOKEN=$(az account get-access-token --scope "https://cognitiveservices.azure.com/.default" --query accessToken -o tsv)
                  echo "::add-mask::$TOKEN"
                  echo "token=$TOKEN" >> $GITHUB_OUTPUT

            - name: Run delivery ensemble
              id: delivery
              if: steps.check-briefs.outputs.count != '0'
              run: |
                  pwsh -NoProfile -File delivery/Invoke-Project42Delivery.ps1 \
                    -Mode harness \
                    -BriefPath briefs/maintenance-queue.json \
                    -Execute
              env:
                  FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
                  FOUNDRY_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
                  WORST_CASE_INPUT_USD_PER_MTOK: "15"
                  WORST_CASE_OUTPUT_USD_PER_MTOK: "60"
                  SCHEMA_ROOT: ${{ github.workspace }}/project42-platform/schemas/content-maintenance
              continue-on-error: false

            # ---- Phase 6: Ingest ----
            - name: Ingest proposals
              id: ingest
              if: steps.check-briefs.outputs.count != '0'
              run: |
                  node scripts/ingest-proposals.mjs \
                    --db content.db \
                    --run-records delivery/run-records \
                    --apply \
                    --ado-sync
              continue-on-error: false

            # ---- Phase 7: Notify ----
            - name: Notify review ready
              id: notify
              if: steps.check-briefs.outputs.count != '0'
              run: |
                  node scripts/notify-review-ready.mjs \
                    --db content.db \
                    --proposals delivery/proposals \
                    --local-proposals delivery/private/local-proposals \
                    --engine-run-id "${{ github.run_id }}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              continue-on-error: false

            # ---- Upload delivery artifacts ----
            - name: Upload delivery artifacts
              if: steps.check-briefs.outputs.count != '0'
              uses: actions/upload-artifact@v4
              with:
                  name: orchard-delivery-${{ github.run_id }}
                  path: |
                      delivery/private/
                      delivery/proposals/
                      content.db
                  retention-days: 30

            # ---- Summary ----
            - name: Summary
              if: always()
              run: |
                  echo "## Orchard Maintenance — ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Phase | Outcome |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Source detection | ${{ steps.source-changes.outcome }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Database | ${{ steps.build-db.outcome }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Briefs | ${{ steps.briefs.outcome }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Delivery | ${{ steps.delivery.outcome }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Ingest | ${{ steps.ingest.outcome }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Notify | ${{ steps.notify.outcome }} |" >> $GITHUB_STEP_SUMMARY

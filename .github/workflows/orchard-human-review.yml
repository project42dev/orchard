# orchard-human-review.yml — closes the loop when a human reviews a proposal
#
# Triggered when someone comments on an Orchard proposal issue.
# Reads the comment for a decision ("Approved" or "Denied"),
# records the publication or rejection, commits content to the platform repo
# (on Approve), syncs ADO state, posts a confirmation, and closes the issue.
#
# The human's ONLY action is commenting "Approved" or "Denied".
# Everything else is automated.

name: Orchard Human Review

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write # needed to push to platform repo

env:
  NODE_VERSION: "22"

jobs:
  review-decision:
    # Only run for Orchard proposal issues, and only for comments (not PRs)
    if: |
      contains(github.event.issue.title, '[Orchard]') &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout orchard
        uses: actions/checkout@v4
        with:
          repository: project42dev/orchard
          path: orchard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: orchard/package-lock.json

      - name: Install dependencies
        working-directory: orchard
        run: npm ci

      # GATE 2. Approval binds to the exact artifact.
      #
      # This step used to run `grep -qiE '^\s*approved\s*$'` on the comment
      # body, so one bare word authorised a commit to the content platform with
      # nothing bound to it: not the item, not the revision, not the bytes. An
      # edited proposal stayed approvable and a stale approval could not be
      # detected. ADR-0025 rejects exactly that shape.
      #
      # The comment body is now passed through the ENVIRONMENT rather than
      # interpolated into the shell. `${{ github.event.comment.body }}` inside a
      # run block is attacker-controlled text pasted straight into a script.
      - name: Determine decision
        id: decision
        working-directory: orchard
        env:
          ORCHARD_COMMENT_BODY: ${{ github.event.comment.body }}
          ORCHARD_COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          ORCHARD_GATE2_ACTORS: ${{ vars.ORCHARD_GATE2_ACTORS }}
        run: |
          set -euo pipefail
          node scripts/gate2-review.mjs --proposals delivery/proposals || true

      - name: Explain a refused decision
        if: steps.decision.outputs.authorised != 'true'
        env:
          ORCHARD_COMMENT_BODY: ${{ github.event.comment.body }}
          ORCHARD_COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          ORCHARD_GATE2_ACTORS: ${{ vars.ORCHARD_GATE2_ACTORS }}
        working-directory: orchard
        run: |
          set -euo pipefail
          # Only answer comments that actually tried to be a decision, so
          # ordinary discussion on the issue is not replied to.
          if printf '%s' "$ORCHARD_COMMENT_BODY" | grep -qiE '^\s*(approved|denied)\s*$|^/orchard'; then
            REASON=$(node scripts/gate2-review.mjs --proposals delivery/proposals \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);console.log((r.errors||[]).map(e=>'- '+e).join('\n')||'- not a Gate 2 decision')})")
            gh issue comment ${{ github.event.issue.number }} --repo project42dev/orchard --body "> [!CAUTION]
          > **No action taken.** This comment did not authorise anything.
          >
          $REASON
          >
          > Gate 2 approval must name the item and the exact artifact digest:
          > \`/orchard gate2 approve item=<id> digest=<sha256>\`
          > Deny or request changes with a reason:
          > \`/orchard gate2 deny item=<id> reason=\"...\"\`"
          fi
        continue-on-error: true

      - name: Acknowledge receipt (approved)
        if: steps.decision.outputs.decision == 'approved'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo project42dev/orchard \
            --body "> [!NOTE]
            > **Received: Approved.** Recording publication, pushing content, and syncing ADO. I'll close this issue when done."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Acknowledge receipt (denied)
        if: steps.decision.outputs.decision == 'denied'
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo project42dev/orchard \
            --body "> [!NOTE]
            > **Received: Denied.** Recording rejection and syncing ADO. I'll close this issue when done."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- EXTRACT SUBJECTS ----
      # Parse the issue body to find all proposal IDs and extract subject_ids.
      # Also extracts target repos so we know where to publish.
      - name: Extract subjects and targets
        id: extract
        run: |
          ISSUE_BODY=$(cat <<'ISSUE_EOF'
          ${{ github.event.issue.body }}
          ISSUE_EOF
          )

          # Extract subject_ids from proposal IDs in the issue body
          # Pattern: `proposal-p42-create-<subject_id>-<hash>` or `proposal-p42-update-<subject_id>-<hash>`
          # We match ONLY the p42-create- and p42-update- forms to avoid matching HTML anchor names
          # like proposal-content-... which are truncated and not real subjects.
          # Also extract the kind (create/update) for each subject.
          SUBJECTS=$(echo "$ISSUE_BODY" | grep -oP 'proposal-p42-(create|update)-[\w-]+-\w{8}' | sed -E 's/proposal-p42-(create|update)-//; s/-[a-f0-9]{8}$//' | sort -u | head -20 | tr '\n' ' ' | sed 's/ *$//')

          # Build a kind map: subject_id -> kind (create or update)
          # We write it as a JSON file so downstream steps can look up the kind
          echo "$ISSUE_BODY" | grep -oP 'proposal-p42-(create|update)-[\w-]+-\w{8}' \
            | sed -E 's/proposal-p42-(create|update)-([\w-]+)-[a-f0-9]{8}$/\2 \1/' \
            | sort -u \
            | awk '{printf "{\"subject\":\"%s\",\"kind\":\"needs-%s\"}\n", $1, $2=="create"?"creating":"updating"}' \
            | jq -s '.' > /tmp/subject-kinds.json

          echo "Subject kinds:"
          cat /tmp/subject-kinds.json

          if [ -z "$SUBJECTS" ]; then
            echo "No proposal IDs found in issue body. Falling back to claimed work items."
            SUBJECTS=$(node -e "
              import { DatabaseSync } from 'node:sqlite';
              const db = new DatabaseSync('orchard/content.db');
              const rows = db.prepare('SELECT subject_id FROM work_item WHERE state IN (\"claimed\", \"in-progress\")').all();
              console.log(rows.map(r => r.subject_id).join(' '));
            ")
          fi

          # Use delimiter syntax for multi-line-safe output
          {
            echo "subjects<<EOF"
            echo "$SUBJECTS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Extracted subjects: $SUBJECTS"

          # Extract target repos from the issue body
          TARGETS=$(echo "$ISSUE_BODY" | grep -oP 'project42dev/[\w.-]+' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          {
            echo "targets<<EOF"
            echo "$TARGETS"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "Target repos: $TARGETS"

      # ---- RECORD PUBLICATION (APPROVED) ----
      - name: Record publication (approved)
        if: steps.decision.outputs.decision == 'approved'
        working-directory: orchard
        run: |
          ACCEPTED_BY="${{ github.event.comment.user.login }}"
          for SUBJECT in ${{ steps.extract.outputs.subjects }}; do
            KIND=$(jq -r --arg s "$SUBJECT" '.[] | select(.subject==$s) | .kind' /tmp/subject-kinds.json)
            echo "Recording publication for: $SUBJECT (kind: $KIND)"
            node scripts/record-publication.mjs \
              --db content.db \
              --subject "$SUBJECT" \
              --kind "$KIND" \
              --accepted-by "$ACCEPTED_BY" \
              --note "Approved via issue #${{ github.event.issue.number }}" \
              --apply
          done

      # ---- RECORD REJECTION (DENIED) ----
      - name: Record rejection (denied)
        if: steps.decision.outputs.decision == 'denied'
        working-directory: orchard
        run: |
          REJECTED_BY="${{ github.event.comment.user.login }}"
          for SUBJECT in ${{ steps.extract.outputs.subjects }}; do
            KIND=$(jq -r --arg s "$SUBJECT" '.[] | select(.subject==$s) | .kind' /tmp/subject-kinds.json)
            echo "Recording rejection for: $SUBJECT (kind: $KIND)"
            node scripts/reject-publication.mjs \
              --db content.db \
              --subject "$SUBJECT" \
              --kind "$KIND" \
              --rejected-by "$REJECTED_BY" \
              --note "Denied via issue #${{ github.event.issue.number }}" \
              --apply
          done

      # ---- PUBLISH CONTENT TO PLATFORM REPO (APPROVED) ----
      # Downloads the delivery artifacts from the engine workflow run that
      # produced these proposals. delivery/private/ is gitignored, so a fresh
      # checkout doesn't have the 04-final.md files.
      # The engine run ID is embedded as an HTML comment in the issue body:
      # <!-- orchard-engine-run-id: 1234567890 -->
      - name: Extract engine run ID from issue body
        id: engine-run
        if: steps.decision.outputs.decision == 'approved'
        run: |
          ISSUE_BODY=$(cat <<'ISSUE_EOF'
          ${{ github.event.issue.body }}
          ISSUE_EOF
          )
          ENGINE_RUN=$(echo "$ISSUE_BODY" | grep -oP '<!-- orchard-engine-run-id: \K\d+' | head -1 || echo "")
          if [ -n "$ENGINE_RUN" ]; then
            echo "Engine run ID: $ENGINE_RUN"
            echo "id=$ENGINE_RUN" >> $GITHUB_OUTPUT
          else
            echo "WARN: No engine run ID found in issue body. Artifact download will be skipped."
            echo "id=" >> $GITHUB_OUTPUT
          fi

      - name: Download delivery artifacts
        if: steps.decision.outputs.decision == 'approved' && steps.engine-run.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          name: orchard-delivery-${{ steps.engine-run.outputs.id }}
          path: orchard/
        continue-on-error: true

      - name: Checkout platform repo for publishing
        if: steps.decision.outputs.decision == 'approved'
        uses: actions/checkout@v4
        with:
          repository: project42dev/project42-platform
          path: platform-repo
          token: ${{ secrets.ORCHARD_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish content to platform repo
        if: steps.decision.outputs.decision == 'approved'
        working-directory: orchard
        run: |
          ACCEPTED_BY="${{ github.event.comment.user.login }}"
          ISSUE_NUM="${{ github.event.issue.number }}"

          for SUBJECT in ${{ steps.extract.outputs.subjects }}; do
            echo "Publishing content for: $SUBJECT"

            # Find the local proposal directory for this subject
            # The proposal JSON has the 8-char hex suffix that matches the
            # first 8 chars of the run directory UUID in local-proposals/.
            PROPOSAL_FILE=$(ls delivery/proposals/proposal-*${SUBJECT}*.json 2>/dev/null | head -1 || echo "")
            if [ -z "$PROPOSAL_FILE" ]; then
              echo "  WARN: No proposal file found for $SUBJECT, skipping publish"
              continue
            fi

            # Extract the 8-char hex suffix from the proposal ID
            # proposal ID format: proposal-p42-create-<subject>-<8hex>
            HEX_SUFFIX=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$PROPOSAL_FILE','utf8')).id.match(/-([0-9a-f]{8})$/i)?.[1] || '')")
            if [ -z "$HEX_SUFFIX" ]; then
              echo "  WARN: No hex suffix in proposal ID, skipping publish"
              continue
            fi

            # Find the run directory by prefix-matching the hex suffix
            RUN_DIR=$(ls -d delivery/private/local-proposals/${HEX_SUFFIX}* 2>/dev/null | head -1 || echo "")
            if [ -z "$RUN_DIR" ]; then
              echo "  WARN: No run directory found for hex suffix $HEX_SUFFIX, skipping publish"
              continue
            fi

            FINAL_FILE="$RUN_DIR/04-final.md"
            if [ ! -f "$FINAL_FILE" ]; then
              echo "  WARN: No 04-final.md at $FINAL_FILE, skipping publish"
              continue
            fi

            echo "  Found: $FINAL_FILE"

            # Determine the surface type from the subject ID
            SURFACE=$(node -e "
              const s = '$SUBJECT';
              if (s.endsWith('-visual-guide')) console.log('visual-guide');
              else if (s.endsWith('-learn')) console.log('learn');
              else if (s.endsWith('-field-guide')) console.log('field-guide');
              else console.log('learn');
            ")

            # Determine target path from the proposal
            TARGET_PATH=$(node -e "
              const p = JSON.parse(require('fs').readFileSync('$PROPOSAL_FILE','utf8'));
              const t = (p.targets || [])[0];
              if (t && t.pathPrefixes && t.pathPrefixes[0]) {
                console.log(t.pathPrefixes[0]);
              } else {
                // Fallback: derive from surface
                const s = '$SURFACE';
                if (s === 'visual-guide') console.log('content/diagrams/');
                else if (s === 'learn') console.log('content/modules/' + p.subjectId + '/');
                else console.log('content/resources/' + p.subjectId + '/');
              }
            ")

            # Determine the output filename
            if [ "$SURFACE" = "visual-guide" ]; then
              OUTPUT_FILE="${TARGET_PATH}$(basename "$TARGET_PATH" .mmd).mmd"
              # Ensure it ends with .mmd
              if ! echo "$OUTPUT_FILE" | grep -q '\.mmd$'; then
                OUTPUT_FILE="${OUTPUT_FILE}.mmd"
              fi
            else
              OUTPUT_FILE="${TARGET_PATH}${SUBJECT}.json"
            fi

            echo "  Surface: $SURFACE"
            echo "  Target: $OUTPUT_FILE"

            # Convert format: markdown → platform JSON or raw mermaid
            node scripts/convert-delivery-format.mjs \
              --input "$FINAL_FILE" \
              --output "../platform-repo/$OUTPUT_FILE" \
              --surface "$SURFACE" \
              --subject "$SUBJECT"

            echo "  ✅ Converted and copied to platform-repo/$OUTPUT_FILE"
          done

      - name: Commit and push to platform repo
        if: steps.decision.outputs.decision == 'approved'
        working-directory: platform-repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Orchard Pipeline"
            git config user.email "orchard@project42.dev"
            git add -A
            git commit -m "feat(orchard): publish approved content from issue #${{ github.event.issue.number }}

            Approved by: ${{ github.event.comment.user.login }}
            Subjects: ${{ steps.extract.outputs.subjects }}"
            git push
            echo "✅ Content pushed to platform repo"
          else
            echo "No content changes to commit."
          fi

      # ---- COMMIT UPDATED DB BACK TO ORCHARD ----
      # record-publication.mjs updated content.db (work_item state → done,
      # publication row inserted). Commit those changes back so the next
      # engine run sees the updated state.
      - name: Commit updated DB to orchard
        if: steps.decision.outputs.decision == 'approved'
        working-directory: orchard
        run: |
          if [ -f content.db ] && [ -n "$(git status --porcelain content.db 2>/dev/null || echo "")" ]; then
            git config user.name "Orchard Pipeline"
            git config user.email "orchard@project42.dev"
            git add content.db
            git commit -m "chore(orchard): update content.db after publishing issue #${{ github.event.issue.number }}

            Approved by: ${{ github.event.comment.user.login }}
            Subjects: ${{ steps.extract.outputs.subjects }}"
            git push
            echo "✅ content.db committed back to orchard"
          else
            echo "No content.db changes to commit (DB may not be tracked or unchanged)."
          fi

      # ---- SYNC ADO STATE ----
      - name: Sync ADO state (approved)
        if: steps.decision.outputs.decision == 'approved'
        working-directory: orchard
        run: |
          for SUBJECT in ${{ steps.extract.outputs.subjects }}; do
            echo "Closing ADO work item for: $SUBJECT"
            node scripts/ado-sync.mjs \
              --db content.db \
              --operation update \
              --apply || echo "  (ADO sync skipped — may not be configured)"
          done

      - name: Sync ADO state (denied)
        if: steps.decision.outputs.decision == 'denied'
        working-directory: orchard
        run: |
          for SUBJECT in ${{ steps.extract.outputs.subjects }}; do
            echo "Closing ADO work item for: $SUBJECT"
            node scripts/ado-sync.mjs \
              --db content.db \
              --operation update \
              --apply || echo "  (ADO sync skipped — may not be configured)"
          done

      # ---- CLOSE ISSUE ----
      - name: Close issue (approved)
        if: steps.decision.outputs.decision == 'approved'
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo project42dev/orchard \
            --comment "✅ **Published.** Content committed to platform repo, ADO synced, publication recorded. Closing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close issue (denied)
        if: steps.decision.outputs.decision == 'denied'
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo project42dev/orchard \
            --comment "❌ **Rejected.** ADO synced, rejection recorded. Closing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

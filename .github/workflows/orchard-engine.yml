# orchard-engine.yml — scheduled content lifecycle engine
#
# Runs the full Orchard lifecycle on a schedule:
#   1. Discovery: find content opportunities
#   2. Scoring: rank them
#   3. Database: rebuild the content index
#   4. Briefs: generate briefs for the delivery ensemble
#   5. Delivery: run the ensemble against Azure AI Foundry
#   6. Ingest: record results in the database
#   7. Notify: create a GitHub Issue for human review
#
# Each step is independent and fails the workflow if it fails, so a failure in
# discovery does not silently skip delivery, and a failure in delivery does not
# silently skip notification.

name: Orchard Engine

on:
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Delivery mode (harness or engine)"
        required: true
        default: "harness"
        type: choice
        options:
          - harness
          - engine

# Only one lifecycle run at a time. A new dispatch cancels an in-progress one.
concurrency:
  group: orchard-engine
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    # Only run scheduled on the default branch
    # workflow_dispatch can run on any branch
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ---- Phase 0: Checkout platform repo for corpus ----
      - name: Checkout project42-platform (corpus)
        uses: actions/checkout@v4
        with:
          repository: project42dev/project42-platform
          path: project42-platform

      # ---- Phase 1: Discovery ----
      - name: Discover content opportunities
        id: discover
        run: |
          # Ensure probes.json exists (use example as starter if not present)
          if [ ! -f content/probes.json ]; then
            echo "No probes.json found; copying example as starter."
            cp content/opportunity-probes.example.json content/probes.json
          fi
          node scripts/discover-content-opportunities.mjs \
            --registry content/opportunity-registry.starter.json \
            --corpus project42-platform/content \
            --probes content/probes.json \
            --out delivery/discovery-proposals.json \
            --gap-threshold 0 \
            --surface learn \
            --timeout 30
        continue-on-error: false

      # ---- Phase 2: Scoring ----
      - name: Score opportunities
        id: score
        run: |
          node scripts/score-opportunities.mjs \
            --registry content/opportunity-registry.starter.json
        continue-on-error: false

      # ---- Phase 2.5: Source-change detection ----
      # Detect changes to registered sources. Changed sources feed into
      # needs-updating work items when the database is rebuilt next.
      - name: Detect source changes
        id: source-changes
        run: |
          mkdir -p delivery/private
          pwsh -NoProfile -Command "
            Import-Module '$(pwd)/delivery/Project42SourceChange.psm1' -Force
            \$changes = @(Get-Project42SourceChangeSet \
              -RegistryPath '$(pwd)/project42-platform/content/source-registry.json' \
              -CheckpointPath '$(pwd)/delivery/private/source-detection.checkpoint.private.json' \
              -DeferChangeCommit)
            \$changed = (\$changes | Where-Object { \$_.state -eq 'changed' }).Count
            \$unreachable = (\$changes | Where-Object { \$_.state -eq 'unreachable' }).Count
            \$unchanged = (\$changes | Where-Object { \$_.state -eq 'unchanged' }).Count
            Write-Host \"source-check: \$unchanged unchanged, \$changed changed, \$unreachable unreachable\"
          "
        continue-on-error: false

      # ---- Phase 3: Database ----
      - name: Build content database
        id: build-db
        run: |
          node scripts/build-content-db.mjs \
            --content project42-platform/content \
            --db content.db \
            --ado-sync
        continue-on-error: false

      # ---- Phase 4: Briefs ----
      - name: Generate delivery briefs
        id: briefs
        run: |
          node scripts/generate-briefs.mjs \
            --db content.db \
            --out briefs/queue.json \
            --inventory config/deployed-models.json \
            --apply
        continue-on-error: false

      # ---- Phase 5: Delivery ----
      # This step requires Azure authentication. The workflow uses OIDC to
      # authenticate to Azure, then the delivery harness uses the resulting
      # token to call the Foundry endpoint.
      # Skipped when there are no briefs to deliver (queue.json is empty or
      # has zero items).
      - name: Check for briefs to deliver
        id: check-briefs
        run: |
          COUNT=$(node -e "const q=require('./briefs/queue.json'); console.log(Array.isArray(q) ? q.length : (q.items||[]).length)")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -eq 0 ]; then
            echo "No briefs to deliver; skipping delivery, ingest, and notify."
          fi

      - name: Azure login
        if: steps.check-briefs.outputs.count != '0'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Foundry access token
        id: token
        if: steps.check-briefs.outputs.count != '0'
        run: |
          TOKEN=$(az account get-access-token --scope "https://cognitiveservices.azure.com/.default" --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run delivery ensemble
        id: delivery
        if: steps.check-briefs.outputs.count != '0'
        run: |
          pwsh -NoProfile -File delivery/Invoke-Project42Delivery.ps1 \
            -Mode ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'harness' }} \
            -BriefPath briefs/queue.json \
            -Execute
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
          WORST_CASE_INPUT_USD_PER_MTOK: "15"
          WORST_CASE_OUTPUT_USD_PER_MTOK: "60"
          SCHEMA_ROOT: ${{ github.workspace }}/project42-platform/schemas/content-maintenance
        continue-on-error: false

      # ---- Phase 6: Ingest ----
      - name: Ingest proposals
        id: ingest
        if: steps.check-briefs.outputs.count != '0'
        run: |
          node scripts/ingest-proposals.mjs \
            --db content.db \
            --run-records delivery/run-records \
            --apply \
            --ado-sync
        continue-on-error: false

      # ---- Phase 7: Notify ----
      - name: Notify review ready
        id: notify
        if: steps.check-briefs.outputs.count != '0'
        run: |
          node scripts/notify-review-ready.mjs \
            --db content.db \
            --proposals delivery/proposals \
            --local-proposals delivery/private/local-proposals \
            --engine-run-id "${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # ---- Upload delivery artifacts for human-review workflow ----
      # delivery/private/ is gitignored, so the human-review workflow can't
      # see 04-final.md files from a fresh checkout. Upload them as a workflow
      # artifact so the human-review workflow can download and publish them.
      # Also include content.db so record-publication.mjs changes persist.
      - name: Upload delivery artifacts
        if: steps.check-briefs.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: orchard-delivery-${{ github.run_id }}
          path: |
            delivery/private/
            delivery/proposals/
            content.db
          retention-days: 30

      # ---- Summary ----
      - name: Summary
        if: always()
        run: |
          echo "## Orchard Engine Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Discover | ${{ steps.discover.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Score | ${{ steps.score.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build DB | ${{ steps.build-db.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Briefs | ${{ steps.briefs.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Delivery | ${{ steps.delivery.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ingest | ${{ steps.ingest.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Notify | ${{ steps.notify.outcome || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY

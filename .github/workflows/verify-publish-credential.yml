name: Verify publish credential

# Publication into the content repository is the one step that cannot be
# proved from a developer machine: the credential lives only in Actions.
# This job answers one question - can the token Orchard would publish with
# actually write to the content repository - without writing anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Can Orchard write to the content repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint content-request App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORCHARD_CONTENT_REQUEST_APP_ID }}
          private-key: ${{ secrets.ORCHARD_CONTENT_REQUEST_APP_PRIVATE_KEY }}
          owner: project42dev
          repositories: project42-content

      - name: Resolve and test the publish credential
        env:
          CONTENT_REPOSITORY: ${{ vars.ORCHARD_CONTENT_REPOSITORY || 'project42dev/project42-content' }}
          # The minted App token is preferred; ORCHARD_PUBLISH_TOKEN is the
          # static fallback. There is deliberately no fallback to the
          # organisation-wide ORG_PAT: that PAT's shared 5,000/hr bucket is
          # not this workflow's to spend (see T-09), so a missing App
          # credential fails loudly instead.
          PUBLISH_TOKEN: ${{ steps.app-token.outputs.token || secrets.ORCHARD_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          HAS_DEDICATED: ${{ secrets.ORCHARD_PUBLISH_TOKEN != '' }}
        run: |
          set -euo pipefail

          echo "Content repository: ${CONTENT_REPOSITORY}"
          echo "Minted App token present: ${HAS_APP_TOKEN}"
          echo "ORCHARD_PUBLISH_TOKEN present: ${HAS_DEDICATED}"

          if [ -z "${PUBLISH_TOKEN}" ]; then
            echo "::error::No publish credential is available at all."
            exit 1
          fi

          # The repository payload reports the permissions the *token* holds,
          # so this is the credential's own answer rather than an inference
          # from which secret happened to be set.
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CONTENT_REPOSITORY}")

          if [ "${status}" != "200" ]; then
            # The reason matters: an expired token, an unauthorised SSO
            # session and a rate limit all fail here and need different
            # fixes. Print GitHub's own message rather than guessing.
            reason=$(jq -r '.message // "no message"' response.json)

            # A rate limit says nothing about the credential's permissions.
            # Reporting it as a denial would send someone to fix an access
            # problem that may not exist, so it exits distinctly.
            case "${reason}" in
              *"rate limit"*)
                echo "::warning::Inconclusive: the credential was rate limited, not refused. Re-run once the limit resets."
                echo "INCONCLUSIVE - rate limited. This says nothing about permissions." >> "${GITHUB_STEP_SUMMARY}"
                exit 78
                ;;
            esac

            echo "::error::The credential cannot even read ${CONTENT_REPOSITORY} (HTTP ${status}): ${reason}"
            exit 1
          fi

          push=$(jq -r '.permissions.push // false' response.json)
          echo "push permission: ${push}"

          {
            echo "## Orchard publish credential"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Target repository | \`${CONTENT_REPOSITORY}\` |"
            echo "| Minted App token | ${HAS_APP_TOKEN} |"
            echo "| Dedicated ORCHARD_PUBLISH_TOKEN | ${HAS_DEDICATED} |"
            echo "| Can read the repository | yes |"
            echo "| Can write the repository | ${push} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${push}" != "true" ]; then
            echo "::error::The credential can read but not write ${CONTENT_REPOSITORY}. An approved publication would fail."
            exit 1
          fi

          echo "The publish credential can write to ${CONTENT_REPOSITORY}."

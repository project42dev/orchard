name: Verify publish credential

# Publication into the content repository is the one step that cannot be
# proved from a developer machine: the credential lives in Key Vault, reached
# only via the content-request managed identity's federated OIDC trust to
# this repository's main branch (T-08). This job answers one question - can
# the token Orchard would publish with actually write to the content
# repository - without writing anything.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Needed only by the Azure login step below: exchanges GitHub's OIDC token
  # for an Azure access token scoped to nothing but reading two Key Vault
  # secrets (T-08).
  id-token: write

jobs:
  verify:
    name: Can Orchard write to the content repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This whole mint path is diagnostic: its job is to report what
      # credential is present, not to fail the run on a missing one (that is
      # what the check below does, on the resolved PUBLISH_TOKEN itself).
      - name: Azure login (OIDC, no stored secret)
        id: azure-login
        continue-on-error: true
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # id-p42orch-content-request-prod-eus-01 (T-08): federated to this
          # repository's main branch, holding Key Vault Secrets User on
          # exactly the two secrets read below.
          client-id: ${{ vars.ORCHARD_CONTENT_REQUEST_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the GitHub App credential from Key Vault
        id: kv
        if: steps.azure-login.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # tsv would silently truncate the multiline PEM private key, so the
          # app id is read as tsv and the private key as json, each masked
          # the instant it is in hand and before it is ever written
          # anywhere, including $GITHUB_OUTPUT.
          app_id="$(az keyvault secret show --vault-name kv-hcs-vault-01 --name hcs-platform-github-app-id --query value -o tsv)"
          echo "::add-mask::$app_id"

          private_key="$(az keyvault secret show --vault-name kv-hcs-vault-01 --name hcs-platform-github-app-private-key -o json | jq -r .value)"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$private_key"

          delimiter="ghapp_$(date +%s%N)_${RANDOM}"
          {
            echo "app-id=$app_id"
            echo "private-key<<$delimiter"
            echo "$private_key"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Mint content-request App token
        id: app-token
        if: steps.kv.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ steps.kv.outputs.app-id }}
          private-key: ${{ steps.kv.outputs.private-key }}
          owner: project42dev
          repositories: project42-content

      - name: Resolve and test the publish credential
        env:
          CONTENT_REPOSITORY: ${{ vars.ORCHARD_CONTENT_REPOSITORY || 'project42dev/project42-content' }}
          # The minted App token is preferred; ORCHARD_PUBLISH_TOKEN is the
          # static fallback. There is deliberately no fallback to the
          # organisation-wide shared PAT this replaces: that PAT's shared
          # 5,000/hr bucket is not this workflow's to spend (see T-09), so a
          # missing App credential fails loudly instead.
          PUBLISH_TOKEN: ${{ steps.app-token.outputs.token || secrets.ORCHARD_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          HAS_DEDICATED: ${{ secrets.ORCHARD_PUBLISH_TOKEN != '' }}
        run: |
          set -euo pipefail

          echo "Content repository: ${CONTENT_REPOSITORY}"
          echo "Minted App token present: ${HAS_APP_TOKEN}"
          echo "ORCHARD_PUBLISH_TOKEN present: ${HAS_DEDICATED}"

          if [ -z "${PUBLISH_TOKEN}" ]; then
            echo "::error::No publish credential is available at all."
            exit 1
          fi

          # The repository payload reports the permissions the *token* holds,
          # so this is the credential's own answer rather than an inference
          # from which secret happened to be set.
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${CONTENT_REPOSITORY}")

          if [ "${status}" != "200" ]; then
            # The reason matters: an expired token, an unauthorised SSO
            # session and a rate limit all fail here and need different
            # fixes. Print GitHub's own message rather than guessing.
            reason=$(jq -r '.message // "no message"' response.json)

            # A rate limit says nothing about the credential's permissions.
            # Reporting it as a denial would send someone to fix an access
            # problem that may not exist, so it exits distinctly.
            case "${reason}" in
              *"rate limit"*)
                echo "::warning::Inconclusive: the credential was rate limited, not refused. Re-run once the limit resets."
                echo "INCONCLUSIVE - rate limited. This says nothing about permissions." >> "${GITHUB_STEP_SUMMARY}"
                exit 78
                ;;
            esac

            echo "::error::The credential cannot even read ${CONTENT_REPOSITORY} (HTTP ${status}): ${reason}"
            exit 1
          fi

          push=$(jq -r '.permissions.push // false' response.json)
          echo "push permission: ${push}"

          {
            echo "## Orchard publish credential"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Target repository | \`${CONTENT_REPOSITORY}\` |"
            echo "| Minted App token | ${HAS_APP_TOKEN} |"
            echo "| Dedicated ORCHARD_PUBLISH_TOKEN | ${HAS_DEDICATED} |"
            echo "| Can read the repository | yes |"
            echo "| Can write the repository | ${push} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${push}" != "true" ]; then
            echo "::error::The credential can read but not write ${CONTENT_REPOSITORY}. An approved publication would fail."
            exit 1
          fi

          echo "The publish credential can write to ${CONTENT_REPOSITORY}."

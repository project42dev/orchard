# curriculum-request-ingest.yml — reads the learner's request and turns it
# into an authoring proposal, with nobody retyping anything.
#
# WHY THIS EXISTS. ingest-curriculum-requests.mjs was written, tested, and then
# wired to nothing: grepping .github/ and scripts/ for it returned only the
# script and its own test. It had never run except by hand, which meant the
# support page's "request new content" button led nowhere at all.
#
# WHERE THE ISSUES LIVE, AND WHAT THAT COSTS. A learner files on
# project42dev/project42-content, because that is the public curriculum
# repository and the one they can reach. This workflow runs in Orchard. Two
# consequences follow and neither is hidden:
#
#   1. `issues: labeled` below fires only for issues on THIS repository. It is
#      kept because an operator may mirror or file a request here, but it is
#      NOT the path a learner's issue takes. The learner's issue is picked up
#      by the schedule, or immediately by `repository_dispatch` if
#      project42-content is ever given a sender workflow that dispatches
#      `content-request-labeled` here.
#   2. The default GITHUB_TOKEN is scoped to this repository. Reading public
#      issues on another public repository works with it, but any write back
#      (the comment-and-close on publication) needs a cross-repository
#      credential. This workflow signs in to Azure with the dedicated
#      content-request managed identity (T-08, OIDC — no stored Azure
#      credential), reads the hcs-platform-app GitHub App's id and private
#      key from kv-hcs-vault-01, and mints a short-lived App installation
#      token scoped to project42dev/project42-content via
#      actions/create-github-app-token, falling back to the static
#      ORCHARD_CONTENT_REQUEST_TOKEN secret, then ORCHARD_PUBLISH_TOKEN (which
#      orchard-human-review.yml already uses). There is deliberately no
#      fallback to the organisation-wide shared PAT that this replaces: that
#      PAT's 5,000/hr bucket is shared with unrelated infrastructure (see
#      T-09), and a failed
#      login, Key Vault read, or mint fails this run loudly instead of
#      silently spending it.
#
# This workflow only READS and reports. It writes no content, moves no
# lifecycle state, and pushes nothing: the proposals it produces are uploaded
# as a run artifact for the merge step to take, exactly as the other GitHub
# Actions entry points here stay read-only while production work happens in the
# Container Apps jobs.

name: Curriculum Request Ingest

on:
    schedule:
        # Hourly. A learner should not wait a day to be picked up, and a poll
        # of one labelled-issue listing costs one API call.
        - cron: "17 * * * *"
    issues:
        types: [labeled]
    repository_dispatch:
        types: [content-request-labeled]
    workflow_dispatch:
        inputs:
            issues_repository:
                description: Repository whose labelled issues are read. Defaults to the curriculum repository.
                required: false
                type: string
            request_label:
                description: The label that marks a content request.
                required: false
                type: string

concurrency:
    group: orchard-curriculum-request-ingest
    cancel-in-progress: false

permissions:
    contents: read
    # Needed only by the Azure login step below: the job exchanges GitHub's
    # OIDC token for an Azure access token, scoped to nothing but reading two
    # Key Vault secrets (T-08). No GitHub write scope is added.
    id-token: write

env:
    NODE_VERSION: "22"
    REQUEST_REPOSITORY: ${{ inputs.issues_repository || vars.ORCHARD_CONTENT_REQUEST_REPOSITORY || 'project42dev/project42-content' }}
    REQUEST_LABEL: ${{ inputs.request_label || vars.ORCHARD_CONTENT_REQUEST_LABEL || 'content-request' }}

jobs:
    ingest:
        name: Convert labelled content requests into proposals
        # An `issues: labeled` event on this repository is only interesting
        # when the label is the request label; every other labelling here is
        # somebody triaging an unrelated issue.
        if: >
            github.event_name != 'issues' ||
            github.event.label.name == 'content-request'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout Orchard
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install locked dependencies
              run: npm ci --ignore-scripts

            - name: Azure login (OIDC, no stored secret)
              uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
              with:
                  # id-p42orch-content-request-prod-eus-01 (T-08): federated to
                  # this repository's main branch, holding Key Vault Secrets
                  # User on exactly the two secrets read below. Never the
                  # deploy identity in deploy-runtime.yml.
                  client-id: ${{ vars.ORCHARD_CONTENT_REQUEST_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Read the GitHub App credential from Key Vault
              id: kv
              shell: bash
              run: |
                  set -euo pipefail
                  # tsv would silently truncate the multiline PEM private key,
                  # so the app id is read as tsv and the private key as json,
                  # each masked the instant it is in hand and before it is
                  # ever written anywhere, including $GITHUB_OUTPUT.
                  app_id="$(az keyvault secret show --vault-name kv-hcs-vault-01 --name hcs-platform-github-app-id --query value -o tsv)"
                  echo "::add-mask::$app_id"

                  private_key="$(az keyvault secret show --vault-name kv-hcs-vault-01 --name hcs-platform-github-app-private-key -o json | jq -r .value)"
                  while IFS= read -r line; do
                    [ -n "$line" ] && echo "::add-mask::$line"
                  done <<< "$private_key"

                  delimiter="ghapp_$(date +%s%N)_${RANDOM}"
                  {
                    echo "app-id=$app_id"
                    echo "private-key<<$delimiter"
                    echo "$private_key"
                    echo "$delimiter"
                  } >> "$GITHUB_OUTPUT"

            - name: Mint content-request App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ steps.kv.outputs.app-id }}
                  private-key: ${{ steps.kv.outputs.private-key }}
                  owner: project42dev
                  repositories: project42-content

            - name: Read labelled content requests
              id: ingest
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.ORCHARD_CONTENT_REQUEST_TOKEN || secrets.ORCHARD_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  # Exit 2 means "some requests were malformed and were skipped".
                  # That is reported, not swallowed: the step below fails the run
                  # so a partial conversion never reads as a clean one.
                  #
                  # Exit 3 means "rate limited; nothing was read and nothing was
                  # written" — see the exit-code contract above main() in
                  # scripts/ingest-curriculum-requests.mjs. It is NOT a failure of
                  # this workflow and it is deliberately not treated as one: this
                  # is an hourly poll, no request is lost by not being read this
                  # hour, and the next run picks up exactly the same issues. A
                  # scheduled job that turns the repository red every hour because
                  # a shared quota was busy teaches the owner to ignore the alert,
                  # which is worse than not running at all.
                  #
                  # The line that separates the two 403s is drawn in
                  # scripts/lib/github-issues.mjs: only a 403 whose GitHub message
                  # says "rate limit" becomes exit 3. A permission refusal — the
                  # credential genuinely cannot read that repository — is exit 1
                  # and still fails this run loudly, which is the case that needs
                  # a human.
                  status=0
                  node scripts/ingest-curriculum-requests.mjs \
                    --from-issues \
                    --issues-repo "$REQUEST_REPOSITORY" \
                    --label "$REQUEST_LABEL" \
                    --out proposals-direct-requests.json || status=$?
                  echo "status=$status" >> "$GITHUB_OUTPUT"
                  if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
                  if [ "$status" -eq 3 ]; then
                    echo "count=0" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "count=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("proposals-direct-requests.json","utf8")).opportunities.length)')" >> "$GITHUB_OUTPUT"

            - name: Say plainly that the quota, not the request, stopped this run
              if: steps.ingest.outputs.status == '3'
              run: |
                  echo "::warning title=Content request ingest was rate limited::No content requests were read this hour. Nothing was lost; the next hourly run reads the same issues. This recurs because the credential in use has no quota of its own — see the job summary."
                  {
                    echo "## Content request ingest: rate limited, nothing read"
                    echo
                    echo "The ingest reached GitHub and was refused with a rate limit, not a permission error."
                    echo "No proposals were written and no request was dropped: the next hourly run reads the"
                    echo "same labelled issues on \`$REQUEST_REPOSITORY\`."
                    echo
                    echo "**This will keep happening until the App credential exists.** This step already tries"
                    echo "to sign in as the content-request managed identity (T-08, OIDC), read the"
                    echo "\`hcs-platform-app\` GitHub App's id and private key from \`kv-hcs-vault-01\`, and mint"
                    echo "an installation token scoped to \`project42dev/project42-content\`, before falling back"
                    echo "to the static \`ORCHARD_CONTENT_REQUEST_TOKEN\` / \`ORCHARD_PUBLISH_TOKEN\` secrets, then"
                    echo "the default \`GITHUB_TOKEN\`. There is no fallback to the organisation-wide shared"
                    echo "PAT this replaces — that PAT's 5,000-requests-per-hour bucket is shared with unrelated"
                    echo "infrastructure (see T-09), so a failed login, Key Vault read, or mint fails loudly"
                    echo "here instead of silently spending it."
                    echo
                    echo "The fix is the App credential this step already prefers. Confirm the"
                    echo "\`id-p42orch-content-request-prod-eus-01\` managed identity is federated to this"
                    echo "repository's \`main\` branch and holds Key Vault Secrets User on exactly"
                    echo "\`hcs-platform-github-app-id\` and \`hcs-platform-github-app-private-key\` in"
                    echo "\`kv-hcs-vault-01\`, and that \`vars.ORCHARD_CONTENT_REQUEST_CLIENT_ID\` names its"
                    echo "client id. The token chain above already prefers the minted token, so no workflow"
                    echo "change is needed once that identity resolves."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the proposals for the merge step
              if: steps.ingest.outputs.status != '3'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: curriculum-request-proposals
                  path: proposals-direct-requests.json
                  if-no-files-found: error

            - name: Fail the run if any request was rejected
              if: steps.ingest.outputs.status == '2'
              run: |
                  echo "::error::One or more content requests could not be converted. See the ingest step log for the issue numbers and reasons."
                  exit 1

            - name: State the boundary
              if: steps.ingest.outputs.status != '3'
              run: |
                  echo "Converted ${{ steps.ingest.outputs.count }} content request(s) from $REQUEST_REPOSITORY."
                  echo "This workflow only reads issues and produces proposals. Authoring, gating, and publication"
                  echo "are performed by the fixed Container Apps Job runtime, not by GitHub Actions."
